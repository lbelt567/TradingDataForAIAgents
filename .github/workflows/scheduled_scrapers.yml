name: Scheduled Scrapers

on:
  schedule:
    # Alpha Vantage earnings - daily 4 AM UTC
    - cron: '0 4 * * *'
    # NASDAQ earnings - daily 5 AM UTC
    - cron: '0 5 * * *'
    # FOMC meetings - weekly Monday 6 AM UTC
    - cron: '0 6 * * 1'
    # FINRA ATS - weekly Monday 6 PM UTC
    - cron: '0 18 * * 1'
    # SEC EDGAR - quarterly (1st of month, every 3 months)
    - cron: '0 8 1 */3 *'
  workflow_dispatch:
    inputs:
      scraper:
        description: 'Scraper to run (alpha_earnings, nasdaq_earnings, fomc, finra_ats, edgar)'
        required: true
        type: choice
        options:
          - alpha_earnings
          - nasdaq_earnings
          - fomc
          - finra_ats
          - edgar

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - scraper: alpha_earnings
            cron: '0 4 * * *'
          - scraper: nasdaq_earnings
            cron: '0 5 * * *'
          - scraper: fomc
            cron: '0 6 * * 1'
          - scraper: finra_ats
            cron: '0 18 * * 1'
          - scraper: edgar
            cron: '0 8 1 */3 *'

    # Only run the matching scraper for each cron schedule,
    # or run all on manual dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.schedule == matrix.cron)

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      BQ_DATASET: ${{ vars.BQ_DATASET || 'trading_data' }}
      ALPHA_API_KEY: ${{ secrets.ALPHA_API_KEY }}
      FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
      FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: |
          SCRAPER="${{ github.event.inputs.scraper || matrix.scraper }}"
          echo "Running scraper: $SCRAPER"
          python -m pipeline run "$SCRAPER"
